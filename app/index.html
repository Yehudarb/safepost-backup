<!DOCTYPE html>
<html lang="en" xml:lang="en" dir="ltr">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="icon" type="image/png" href="/icon128.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafePost - FB Automation Suite</title>
    <!-- Fonts for Hebrew -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@100;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
        /* Font only on the universal selector. Do NOT set `direction` anywhere in this
           file: a hardcoded direction overrides every dir="ltr"/dir="rtl" element (the
           timer, task IDs, timestamps), which once made "05:00" render reversed as
           "00:05". LanguageProvider sets dir on <html> at runtime instead, so the
           browser's native per-element dir handling stays intact. */
        * {
            font-family: 'Noto Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif !important;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        html, body {
            font-family: 'Noto Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif !important;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
