<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <style>
        :root { color-scheme: dark; }
        body { width: 300px; margin: 0; padding: 16px; font-family: -apple-system, "Segoe UI", sans-serif; background: #0d1117; color: #e6edf3; }
        h3 { margin: 0 0 4px; font-size: 15px; color: #58a6ff; }
        .status { font-size: 12px; font-weight: 600; color: #3fb950; margin-bottom: 14px; }
        label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #8b949e; margin: 12px 0 4px; }
        input { width: 100%; box-sizing: border-box; padding: 7px 9px; font-size: 13px; border: 1px solid #30363d; border-radius: 6px; background: #161b22; color: #e6edf3; }
        .row { display: flex; gap: 8px; margin-top: 10px; }
        button { flex: 1; padding: 8px; font-size: 12px; font-weight: 600; border: 1px solid #30363d; border-radius: 6px; background: #21262d; color: #e6edf3; cursor: pointer; }
        button.primary { background: #238636; border-color: #238636; }
        button:hover { filter: brightness(1.1); }
        .test-result { font-size: 11px; margin-top: 8px; min-height: 14px; }
        .section { border: 1px solid #21262d; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
        .meta { margin-top: 14px; padding-top: 12px; border-top: 1px solid #21262d; font-size: 11px; color: #8b949e; }
        .meta div { display: flex; justify-content: space-between; margin: 3px 0; }
        .meta code { color: #c9d1d9; font-family: monospace; }
        .ok { color: #3fb950; }
        .err { color: #f85149; }
        .code-input { text-transform: uppercase; letter-spacing: 0.25em; text-align: center; font-family: monospace; font-size: 16px; }

        /* Dry Run. This popup is a dark-only UI, so the state is carried by an
           accent border + accent text on the existing dark surface — the first
           version used light "warning" backgrounds from a light-theme palette,
           which left the subtitle as grey-on-cream and effectively invisible.
           Colours are the same GitHub-dark accents already used above. */
        .dryrun { border: 1px solid #30363d; border-left-width: 4px; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; background: #161b22; }
        .dryrun.on { border-left-color: #d29922; }
        .dryrun.off { border-left-color: #f85149; }
        .dryrun-title { display: flex; align-items: center; gap: 8px; margin: 0; cursor: pointer; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #e6edf3; }
        .dryrun-title input { width: auto; margin: 0; accent-color: #d29922; }
        .dryrun-sub { font-size: 11px; color: #c9d1d9; margin-top: 5px; }
        .dryrun-state { margin-top: 7px; font-size: 12px; font-weight: 700; }
        .dryrun.on .dryrun-state { color: #e3b341; }
        .dryrun.off .dryrun-state { color: #ff7b72; }
    </style>
</head>

<body>
    <h3>SafePost Automation</h3>
    <div class="status">● System Active</div>

    <!-- Dry Run: the operator must be able to see, at a glance and before any
         test, whether this install can publish to Facebook. -->
    <div class="dryrun" id="dryRunSection">
        <label class="dryrun-title" for="dryRunMode">
            <input id="dryRunMode" type="checkbox" />
            <span>Dry Run Mode</span>
        </label>
        <div class="dryrun-sub">Prevent final Facebook publish</div>
        <div id="dryRunState" class="dryrun-state"></div>
    </div>

    <!-- Pairing -->
    <div class="section">
        <label>Pair with SafePost workspace</label>
        <div id="unpaired">
            <input id="pairCode" class="code-input" type="text" placeholder="8-CHAR CODE" maxlength="8" autocomplete="off" />
            <div class="row"><button id="pairBtn" class="primary">Pair</button></div>
            <div id="pairResult" class="test-result"></div>
        </div>
        <div id="paired" style="display:none">
            <div class="meta" style="margin-top:0; padding-top:0; border-top:none">
                <div><span>Status</span><code class="ok">● Paired</code></div>
                <div><span>Worker</span><code id="pairedWorker">—</code></div>
                <div><span>Workspace</span><code id="pairedWs">—</code></div>
            </div>
            <div class="row"><button id="unpairBtn">Unpair this device</button></div>
        </div>
    </div>

    <label for="apiUrl">API Server URL</label>
    <input id="apiUrl" type="url" placeholder="https://safepost-backup.onrender.com" autocomplete="off" />

    <label for="extensionKey">Extension key <span style="font-weight:400;opacity:.7">(optional)</span></label>
    <input id="extensionKey" type="password" placeholder="Only if the server requires one" autocomplete="off" />

    <div class="row">
        <button id="saveBtn" class="primary">Save</button>
        <button id="testBtn">Test connection</button>
    </div>
    <div id="testResult" class="test-result"></div>

    <div class="meta">
        <div><span>Extension version</span><code id="version">—</code></div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
